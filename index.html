<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inglés II – Práctica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: juguetón pero claro, como un cuaderno de práctica con alma de cartucho de juego
   IDEA: cada sección es un "nivel" con su botón de corregir y XP que se suma
   PICTURE: los ejercicios mismos, con la barra de XP del encabezado como HUD
   COLOUR and TYPE: amarillo de etiqueta de cartucho + tinta negra, verde/rojo para el feedback; Rubik + Press Start 2P para el HUD
   LAYOUT: una columna tranquila de ≤760px, pestañas de unidades arriba, secciones apiladas */
:root{color-scheme:light dark;--bg:light-dark(#fbfaf6,#141318);--ink:light-dark(#17161c,#efedf4);--mut:light-dark(#5d5a66,#a9a5b4);--card:light-dark(#fff,#1d1c23);--line:light-dark(#e3e0d8,#2e2c36);--y:#ffcf3a;--ok:light-dark(#127a45,#4fd38c);--okb:light-dark(#e3f6eb,#11301f);--bad:light-dark(#c2342b,#ff7a70);--badb:light-dark(#fde8e6,#3a1a18);--acc:light-dark(#2f4bd8,#8ea0ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Rubik,system-ui,sans-serif;overflow-x:clip}
header{background:var(--y);color:#17161c;padding:28px max(5vw,16px) 0}
.wrap{max-width:760px;margin:0 auto}
.px{font-family:"Press Start 2P",monospace;font-size:13px;line-height:1.6}
h1{font-size:clamp(30px,5vw,44px);line-height:1.05;margin:10px 0 6px;font-weight:800;text-wrap:balance}
.sub{margin:0 0 18px;max-width:60ch}
.hud{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.bar{flex:1 1 220px;height:18px;background:#17161c;border-radius:4px;padding:3px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fd38c,#9ff0c3);border-radius:2px;transition:width .5s}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:0}
.tabs button{flex:none;font:500 15px Rubik,sans-serif;border:0;border-radius:8px 8px 0 0;padding:10px 14px;min-height:44px;background:rgba(23,22,28,.12);color:#17161c;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--bg);color:var(--ink);font-weight:700}
.tabs button:disabled{opacity:.5;cursor:not-allowed}
main{padding:24px max(5vw,16px) 64px}
.tip{border-left:4px solid var(--y);background:var(--card);padding:14px 16px;border-radius:0 10px 10px 0;margin:0 0 28px}
.tip b{font-weight:700}
.tip code{font:500 15px Rubik;background:light-dark(#fff3c4,#3a3110);padding:1px 6px;border-radius:4px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px clamp(14px,3vw,24px);margin-bottom:22px}
h2{font-size:22px;line-height:1.2;margin:0 0 4px}
.ins{color:var(--mut);margin:0 0 14px}
ol{margin:0;padding-left:1.6em}
li{padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.q{margin-bottom:8px}
input[type=text],select{font:16px Rubik,sans-serif;width:100%;padding:10px 12px;min-height:44px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
select{width:auto;min-width:110px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ch{display:flex;gap:8px;flex-wrap:wrap}
.ch button{font:500 15px Rubik;min-height:44px;padding:8px 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-align:left}
.ch button.on{border-color:var(--acc);background:light-dark(#e9edff,#232a52)}
.fix{margin-top:8px}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:15px;display:none}
.fb.ok{display:block;background:var(--okb);color:var(--ok)}
.fb.bad{display:block;background:var(--badb);color:var(--bad)}
.acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.btn{font:700 15px Rubik;min-height:44px;padding:10px 18px;border-radius:10px;border:0;background:#17161c;color:#ffcf3a;cursor:pointer}
:root[data-theme=dark] .btn{background:var(--y);color:#17161c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn{background:var(--y);color:#17161c}}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
:root .ghost{background:transparent!important;color:var(--ink)!important}
.score{font-weight:700}
u{text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--acc)}
.card{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
details summary{cursor:pointer;color:var(--acc);font-weight:500;min-height:32px;padding-top:6px}
.m{color:var(--mut)}
.note{font-size:14px;color:var(--mut);margin-top:22px}
</style>
</head>

2:{tab:'2 · Present',title:'Unit 2 · Present simple vs continuous',
 tip:`<b>Present simple</b> → hábitos, rutinas, hechos, historias de juegos: <i>She <b>plays</b> every day.</i> · <i>The game <b>takes</b> place in Neo-Tokyo.</i> (<i>usually, always, every day, once a week, never</i>)<br>
 <b>Present continuous</b> → lo que pasa ahora o en este período, y planes ya arreglados: <i>Nova <b>is escaping</b> from a drone.</i> · <i>We<b>'re working</b> on the levels this week.</i> (<i>now, right now, at the moment, currently, these days, Look!</i>)<br>
 <b>Stative verbs</b> no van en continuo: <i>know, want, need, like, love, hate, believe, understand, belong, mean, prefer, seem</i>.<br>
 <b>Cambian de significado:</b> <i>I <b>think</b> it's good</i> (opino) / <i>I'm <b>thinking</b> about it</i> (lo pienso) · <i>I <b>have</b> a car</i> / <i>I'm <b>having</b> lunch</i> · <i>It <b>tastes</b> great</i> / <i>The chef is <b>tasting</b> it</i> · <i>You <b>are</b> silly</i> (siempre) / <i>You're <b>being</b> silly</i> (ahora).`,

3:{tab:'3 · Past',title:'Unit 3 · Past simple vs past continuous',
 tip:`<b>Past simple</b> → acciones terminadas, eventos principales, uno detrás del otro: <i>She <b>stopped</b>, <b>got</b> out of the car and <b>saw</b> a dog.</i><br>
 <b>Past continuous</b> (<code>was/were + -ing</code>) → acción en progreso, el fondo de la historia: <i>It was getting dark and people <b>were going</b> home.</i><br>
 <b>Interrupción:</b> <i>I <b>was playing</b> (fondo) <b>when</b> the power <b>went</b> off (evento).</i> · <i><b>While</b> + continuo, <b>when</b> + simple</i>.<br>
 <b>Ojo:</b> después de <i>did / didn't</i> el verbo va pelado → <i>Did you <b>finish</b>?</i> · <i>She didn't <b>go</b></i>. Los stative verbs tampoco van en continuo en pasado (<i>I <b>knew</b></i>, no <i>was knowing</i>).<br>
 <b>Secuenciadores:</b> <i>to begin with, at first, then, next, suddenly, after a few minutes, half an hour later, in the end, finally, at last</i>.<br>
 <b>Conectores:</b> propósito <i>so that, in order to</i> · causa <i>because, since, as</i> · resultado <i>so, as a result</i>.`,

4:{tab:'4 · Future',title:'Unit 4 · Will vs going to',
 tip:`<b>Be going to</b> → planes ya decididos antes de hablar y predicciones con <b>evidencia</b>: <i>We<b>'re going to</b> release the beta in March.</i> · <i>Look at those clouds! It<b>'s going to</b> rain.</i><br>
 <b>Will</b> → decisiones en el momento, promesas, ofrecimientos y predicciones <b>sin evidencia</b> u opiniones (<i>I think, maybe, probably, I'm sure</i>): <i>I'm cold. — I<b>'ll</b> close the window.</i> · <i>I<b>'ll</b> call you, I promise.</i> · <i>I think players <b>will</b> love it.</i><br>
 <b>Present continuous</b> → arreglos con fecha y hora: <i>We<b>'re meeting</b> the publisher on Friday.</i><br>

 {id:'f',t:'mc',mix:true,title:'Nivel 6 · Reading comprehension',ins:`Leé el texto y contestá.<span class="card" style="display:block;margin-top:10px;color:var(--ink)"><b>Skyforge: launch news</b><br>Next year, our studio is going to launch <i>Skyforge</i>, a cross-platform survival game. The release date is already fixed: players are going to download it on March 3rd. We aren't going to sell physical copies; the game will be available only through a subscription service. Our tests show that the servers are going to need a big upgrade, because 40,000 players joined the beta in a single weekend. What will happen after launch? Nobody knows for sure, but we think competitive players will love the ranked mode, and maybe we will organise our first e-sports tournament in 2028. One thing is certain: we won't stop updating the game. We promise new content every season.</span><span class="m" style="font-size:14px">Texto de práctica escrito para este ejercicio.</span>`,items:[

5:{tab:'5 · Pres. perfect',title:'Unit 5 · Present perfect & comparatives',
 tip:`<b>Present perfect</b> <code>have/has + participio</code> → experiencias (<i>I<b>'ve been</b> to Brazil</i>), algo que acaba de pasar (<i>I<b>'ve just finished</b></i>), lo que importa es la acción, no el cuándo. Con <i>for / since</i>: algo que empezó en el pasado y sigue (<i>I<b>'ve lived</b> here for 6 years</i>).<br>
 <b>Past simple</b> → cuando decís o preguntás el momento: <i>yesterday, last week, in 2019, when I was a kid, When…?</i> → <i>I <b>saw</b> it last week.</i><br>
 <b>For</b> + período (<i>for ten years</i>) · <b>since</b> + punto de inicio (<i>since 2012, since I was born</i>).<br>
 <b>Ever</b> (preguntas) · <b>never</b> · <b>just</b> (recién) · <b>already</b> (ya, antes de lo esperado) · <b>yet</b> (preguntas y negativas, al final).<br>
 <b>Been vs gone:</b> <i>He's <b>been</b> to Paris</i> (fue y volvió) · <i>He's <b>gone</b> to Paris</i> (está allá ahora).<br>
 <b>Comparativos:</b> <i>fast<b>er</b> than · <b>more</b> realistic than · <b>the</b> fast<b>est</b> · <b>the most</b> iconic · <b>as</b> big <b>as</b></i> · irregulares: <i>good → better → the best, bad → worse → the worst</i>.`,

6:{tab:'6 · Money',title:'Unit 6 · How much is it?',
 tip:`<b>Relative clauses:</b> <i><b>who</b></i> para personas · <i><b>which / that</b></i> para cosas · <i><b>where</b></i> para lugares → <i>A customer is a person <b>who</b> buys things.</i> · <i>A bank is a place <b>where</b> you keep money.</i><br>
 <b>Cuantificadores:</b> <i>some</i> (afirmativas) / <i>any</i> (negativas y preguntas) · <i>much</i> + incontables / <i>many</i> + contables · <i>a lot of / lots of</i> (los dos) · <i>a few</i> + contables / <i>a little</i> + incontables (poco) · <i>too much / too many</i> = más de lo necesario (negativo) · <i>enough</i> = lo necesario.<br>
 <b>Dinero:</b> <i><b>borrow</b></i> (pedir prestado) ≠ <i><b>lend</b></i> (prestar) · <i>owe</i> (deber) · <i>afford</i> (poder pagar) · <i>save up</i> (ahorrar) · <i>receipt</i> (ticket de compra) · <i>bill</i> (cuenta/factura) · <i>balance</i> (saldo) · <i>cash, coins, notes</i>.<br>

7:{tab:'7 · Modals',title:'Unit 7 · Modals of obligation',
 tip:`<b>Must / have to</b> → obligación: <i>You <b>must</b> collect all the coins to open the chest.</i> · <i>I <b>have to</b> work tomorrow.</i><br>
 <b>Mustn't</b> → prohibición (no podés): <i>You <b>mustn't</b> touch the red button.</i><br>
 <b>Don't have to</b> → no es necesario (podés, pero no hace falta): <i>You <b>don't have to</b> do this side quest.</i> ⚠ <i>mustn't</i> ≠ <i>don't have to</i>.<br>
 <b>Should / shouldn't</b> → consejo: <i>You <b>should</b> save before the boss.</i> · <b>Can / can't</b> → capacidad o permiso.<br>
 <b>Pasado:</b> <i>must / have to → <b>had to</b></i> · <i>don't have to → <b>didn't have to</b></i> · prohibición en pasado: <i><b>weren't allowed to</b></i>.<br>
 <b>Forma:</b> modal + verbo pelado (nunca <i>must to, should to</i>) · <i>have to</i> se conjuga: <i>She <b>has</b> to · <b>Does</b> she <b>have</b> to…? · He <b>doesn't</b> have to</i>.`,
 note:'Basado en Unit 7 de la cátedra: modal verbs en videojuegos, el quiz de must / have to / should y "Video Game Law".',

 {id:'d',t:'mc',mix:true,title:'Nivel 4 · Reading comprehension',ins:`Leé el texto y contestá.<span class="card" style="display:block;margin-top:10px;color:var(--ink)"><b>Games and the law</b><br>Making a game is expensive, so studios have to protect their work. Copyright protects the game itself: the code, the characters, the story, the images and the music. A trademark protects the name, the logo and the slogan. If another company wants to use a famous character, it has to pay for a licence. Advertising has rules too: ads mustn't be misleading, so if a free game sells items, the ad should make that clear. Privacy is another big area. Companies must protect the data they collect, especially children's data, and they mustn't share it with other companies without permission. Players don't have to read every legal document, but they should check what data a game collects.</span><span class="m" style="font-size:14px">Texto de práctica escrito para este ejercicio, basado en el tema de "Video Game Law".</span>`,items:[

8:{tab:'8 · Conditionals',title:'Unit 8 · First & second conditional',
 tip:`<b>1st conditional</b> (situación real o posible): <code>If + presente simple, will + verbo</code> → <i>If the player <b>presses</b> jump, the character <b>will jump</b>.</i><br>
 <b>2nd conditional</b> (situación imaginaria o hipotética): <code>If + pasado simple, would + verbo</code> → <i>If I <b>had</b> more money, I <b>would buy</b> a new PC.</i> · <i>If I <b>were</b> you, I'd save now.</i><br>
 <b>Nunca</b> va <i>will</i> ni <i>would</i> en la parte del <i>if</i>: <i>If you <s>will press</s> <b>press</b>…</i> · <i>If I <s>would have</s> <b>had</b>…</i><br>
 <b>Orden:</b> se pueden dar vuelta → <i>The door will open <b>if</b> you press the button.</i> Cuando el <i>if</i> va primero, lleva coma.<br>
 <b>Preguntas:</b> <i>What <b>will</b> you do if the server crashes?</i> · <i>What <b>would</b> you do if you won the lottery?</i>`,

  ["Elegí un juego y decí 8 comandos con causa y consecuencia (1st conditional, actividad de la cátedra).","In Super Mario: if you press A, Mario will jump. If you jump on a Goomba, it will die. If you touch an enemy, you will lose a life. If you collect 100 coins, you will get an extra life. If you eat a mushroom, you will grow. If you take a star, you will be invincible. If you fall into a hole, you will die. If you reach the flag, you will finish the level."],

  ["What would you do if…? Contestá 3: …you won the lottery? …you could live in a videogame? …you were the president?","If I won the lottery, I would open my own game studio. If I could live in a videogame, I would live in Zelda, because the world is beautiful. If I were the president, I would invest more money in education."],

};
const TABS=['1 · Questions','2 · Present','3 · Past','4 · Future','5 · Pres. perfect','6 · Money','7 · Modals','8 · Conditionals'];

/* ================= ESTADO ================= */
const LK='ingles2-u1',DOC='progress/u1';
const mig=o=>{const r={};for(const k in o)r[/^[a-z]/.test(k)?'1'+k:k]=o[k];return r};
let saved={};try{saved=mig(JSON.parse(localStorage.getItem(LK)||'{}'))}catch(e){}
let cur=UNITS[saved._u]?+saved._u:1;
const save=()=>{try{localStorage.setItem(LK,JSON.stringify(saved))}catch(e){};sched()};

const CONTR={"what's":"what is","where's":"where is","who's":"who is","how's":"how is","it's":"it is","doesn't":"does not","don't":"do not","didn't":"did not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","they're":"they are","you're":"you are","we're":"we are","i'm":"i am","haven't":"have not","hasn't":"has not","wouldn't":"would not","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'd":"i would","you'd":"you would","we'd":"we would","they'd":"they would","he'd":"he would","she'd":"she would","it'd":"it would","i'll":"i will","you'll":"you will","we'll":"we will","they'll":"they will","it'll":"it will","he'll":"he will","she'll":"she will","won't":"will not","'ll":"will","'m":"am","'s":"is","'re":"are","he's":"he is","she's":"she is","can't":"cannot"};
const norm=s=>{s=(s||'').toLowerCase().replace(/[’`´]/g,"'").replace(/[?¿.!,;:"]/g,' ').replace(/video game/g,'videogame').replace(/favorite/g,'favourite').replace(/\s+/g,' ').trim();
  return s.split(' ').map(w=>CONTR[w]||w).join(' ')};
const match=(v,acc)=>acc.some(a=>norm(a)===norm(v));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const strip=s=>s.replace(/<u>(.*?)<\/u>/g,'[$1]').replace(/<span.*?<\/span>/g,'').replace(/<[^>]+>/g,'').trim();
const $=id=>document.getElementById(id);

/* ================= RENDER ================= */
const K=(s,i,x='')=>cur+s.id+i+x;
const txt=(k,ph)=>`<input type="text" data-k="${k}" placeholder="${ph||'Escribí la pregunta…'}" autocomplete="off" spellcheck="false" value="${esc(saved[k]||'')}">`;
const hsh=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const chs=(k,opts,mix)=>{let ord=opts.map((_,j)=>j);if(mix){let h=hsh(k);h^=h>>>13;h=Math.imul(h,0x5bd1e995)>>>0;h=(h^(h>>>15))>>>0;const r=h%opts.length;ord=ord.slice(r).concat(ord.slice(0,r))}
  return `<div class="ch" data-k="${k}">${ord.map(j=>`<button type="button" data-v="${j}" class="${saved[k]==j?'on':''}">${opts[j]}</button>`).join('')}</div>`};
const item={
 ci:(s,x,i)=>`<div class="q">${x[0]}</div>${chs(K(s,i,'c'),['Correcta','Incorrecta'])}<div class="fix" data-fx="${K(s,i,'c')}" ${saved[K(s,i,'c')]=='1'?'':'hidden'}>${txt(K(s,i,'t'),'Escribí la versión correcta…')}</div>`,
 txt:(s,x,i)=>`<div class="q">${x[0]}</div>${txt(K(s,i),s.ph)}`,
 mc:(s,x,i)=>`<div class="q">${x[0]}</div>${chs(K(s,i),x[1],s.mix)}`,
 sel:(s,x,i)=>`<div class="inline"><select data-k="${K(s,i)}"><option value="">elegí…</option>${s.opts.map(a=>`<option ${saved[K(s,i)]===a?'selected':''}>${a}</option>`).join('')}</select><span>${x[0]}</span></div>`};
const render=()=>{const U=UNITS[cur];
  $('ttl').textContent=U.title;$('tip').innerHTML=U.tip;$('nt').textContent=U.note;
  $('tabs').innerHTML=TABS.map((t,i)=>`<button role="tab" data-u="${i+1}" aria-selected="${i+1===cur}" ${UNITS[i+1]?'':'disabled title="Próximamente"'}>${t}</button>`).join('');
  $('app').innerHTML=U.secs.map(s=>`<section id="s-${s.id}"><h2>${s.title}</h2><p class="ins">${s.ins}</p>`+
   (s.t==='oral'?s.items.map(x=>`<div class="card"><b>${x[0]}</b><details><summary>Ver ejemplo</summary>${x[1]}</details></div>`).join(''):
   `<ol>${s.items.map((x,i)=>`<li>${item[s.t](s,x,i)}<div class="fb" id="fb-${s.id}${i}"></div></li>`).join('')}</ol><div class="acts"><button class="btn" data-g="${s.id}">Corregir</button><button class="btn ghost" data-r="${s.id}">Borrar</button><span class="score" id="sc-${s.id}"></span></div>`)+`</section>`).join('');
  hud()};

/* ================= CORRECCIÓN ================= */
const pts={};
const gradable=()=>UNITS[cur].secs.filter(s=>s.t!=='oral');
const hud=()=>{let got=0,all=0;gradable().forEach(s=>{all+=s.items.length;got+=pts[cur+s.id]||0});
  $('xp').textContent=`XP ${got} / ${all}`;$('xpb').style.width=(all?got/all*100:0)+'%'};
const check=(s,x,i)=>{
  if(s.t==='ci'){const c=saved[K(s,i,'c')],t=saved[K(s,i,'t')];
    if(x[1])return[c==0,'Esta estaba bien.'];
    return[c==1&&match(t,[x[2]].concat(x[3]||[])),(c==1?'Corrección: ':'Está mal → ')+'<b>'+x[2]+'</b>']}
  if(s.t==='txt')return[match(saved[K(s,i)],x[1]),'Respuesta: <b>'+x[1][0]+'</b>'];
  if(s.t==='mc')return[saved[K(s,i)]==x[2],'Era: <b>'+x[1][x[2]]+'</b>'];
  if(s.t==='sel')return[saved[K(s,i)]===x[1],x[2]||'Era: <b>'+x[1]+'</b>']};
const grade=s=>{let n=0;s.items.forEach((x,i)=>{const[ok,msg]=check(s,x,i);const el=$('fb-'+s.id+i);el.className='fb '+(ok?'ok':'bad');el.innerHTML=ok?'✓ ¡Bien!':'✗ '+msg;n+=ok?1:0});
  pts[cur+s.id]=n;$('sc-'+s.id).textContent=`${n} / ${s.items.length}`;hud()};

/* ================= EVENTOS ================= */
const onVal=ev=>{const k=ev.target.dataset.k;if(k&&!ev.target.closest('.ch')){saved[k]=ev.target.value;save()}};
$('app').addEventListener('input',onVal);$('app').addEventListener('change',onVal);
$('app').addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
  const grp=b.parentElement.dataset.k;
  if(grp){saved[grp]=b.dataset.v;save();[...b.parentElement.children].forEach(x=>x.classList.toggle('on',x===b));
    const fx=document.querySelector(`[data-fx="${grp}"]`);if(fx)fx.hidden=b.dataset.v!=='1';return}
  const s=UNITS[cur].secs.find(z=>z.id===(b.dataset.g||b.dataset.r));if(!s)return;
  if(b.dataset.g)return grade(s);
  Object.keys(saved).forEach(k=>{if(k.startsWith(cur+s.id))delete saved[k]});save();delete pts[cur+s.id];render()});
$('tabs').addEventListener('click',ev=>{const b=ev.target.closest('button[data-u]');if(!b||b.disabled)return;
  cur=+b.dataset.u;saved._u=cur;save();render();scrollTo({top:0})});

/* ================= GUARDADO EN LA NUBE ================= */
let db=null,tm=null,busy=false,dirty=false;
const st=t=>{$('st').textContent=t};
const ref=()=>db.doc(DOC);
async function push(){if(!db)return;if(busy){dirty=true;return}busy=true;
  try{await ref().set({saved,at:Date.now()});st('✓ Guardado')}catch(e){st('⚠ No se pudo guardar')}
  busy=false;if(dirty){dirty=false;push()}}
function sched(){if(!db)return;st('Guardando…');clearTimeout(tm);tm=setTimeout(push,700)}

render();
(async()=>{
  const to=setTimeout(()=>{if(!db)st('Sin conexión: guardado solo en este navegador')},10000);
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){clearTimeout(to);st('✓ Progreso guardado en este navegador');return}
  try{const s=await ref().get();clearTimeout(to);
    const d=s&&typeof s.data==='function'?s.data():(s&&s.data!==undefined?s.data:s);
    if(d&&d.saved&&Object.keys(d.saved).length){saved=Object.assign({},saved,mig(d.saved));if(UNITS[saved._u])cur=+saved._u;
      try{localStorage.setItem(LK,JSON.stringify(saved))}catch(e){};render();st('✓ Progreso cargado');push()}
    else{st('✓ Guardado en la nube activo');if(Object.keys(saved).length)push()}
  }catch(e){clearTimeout(to);st('✓ Guardado en la nube activo');if(Object.keys(saved).length)push()}
})();
}
</script>
